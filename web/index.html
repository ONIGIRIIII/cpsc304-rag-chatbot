<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CPSC 304 Study Assistant</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="blob blob-4"></span>
  </div>

  <div id="sidebar-backdrop"></div>

  <aside id="sidebar">
    <button id="new-chat" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      New chat
    </button>
    <div id="session-list"></div>
  </aside>

  <header>
    <div class="brand-group">
      <button id="history-toggle" type="button" aria-label="Chat history">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="brand">CPSC 304</span>
      <span class="brand-sub">Study Assistant</span>
    </div>
    <button id="theme-toggle" type="button" aria-label="Toggle theme">
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="empty-state">
      <h1>Ask anything about your slides.</h1>
      <p>Answers are grounded in your CPSC 304 lecture decks, with sources cited below each reply.</p>
    </div>

    <div id="chat"></div>
  </main>

  <form id="chat-form">
    <input id="question" type="text" placeholder="Ask a question…" autocomplete="off" />
    <button type="submit" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M4 12h16M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
